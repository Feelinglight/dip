[package]
name = "dip"
description = "Digital image processing lib and visualizer"
version = "0.1.0"
edition = "2024"

[[bin]]
path = "src/main.rs"
name = "dip"

[dependencies]
eframe = { version = "0.35.0", features = ["persistence"] }
egui = "0.35.0"
egui_plot = "0.36.0"
image = "0.25.10"
log = "0.4.33"
serde = "1.0.228"
intensity = { version = "0.1.0", path = "../intensity" }
egui_extras = { version = "0.35.0", features = ["image"] }
egui_dock = { version = "0.20.1", features = ["serde"] }
serde_json = "1.0.150"
rfd = "0.17.2"
pollster = "0.4.0"
egui_ltreeview = {version = "0.8.0", features = ["persistence"]}

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.11"
uuid = { version = "1.23.4", features = ["v4"] }

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.76"
web-sys = "0.3.103"              # to access the DOM (to hide the loading text)
uuid = { version = "1.23.4", features = ["v4", "js"] }
chacha20 = { version = "0.10.1" }

[lints]
workspace = true

