[package]
name = "dip"
description = "Digital image processing lib and visualizer"
version = "0.1.0"
edition = "2024"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]


[dependencies]
eframe = { version = "0.35.0", features = ["persistence"] }
egui = "0.35.0"
egui_plot = "0.36.0"
image = "0.25.10"
log = "0.4.33"
serde = "1.0.228"
intensity = { version = "0.1.0", path = "crates/intensity" }
egui_extras = { version = "0.35.0", features = ["image"] }
catppuccin-egui = { version = "5.7.0", default-features = false, features = ["egui33"] }
egui_dock = { version = "0.20.1", features = ["serde"] }
serde_json = "1.0.150"
rfd = "0.17.2"
pollster = "0.4.0"

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.11"
uuid = { version = "1.23.4", features = ["v4"] }

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.76"
web-sys = "0.3.103"              # to access the DOM (to hide the loading text)
uuid = { version = "1.23.4", features = ["v4", "js"] }
chacha20 = { version = "0.10.1" }

[profile.release]
opt-level = 2 # fast and small wasm

# Optimize all dependencies even in debug builds:
[profile.dev.package."*"]
opt-level = 2

[[bin]]
path = "crates/visualizer/main.rs"
name = "dip"

[workspace]
members = [
  "crates/intensity",
]

[lints.clippy]
indexing_slicing = "warn"
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
cargo_common_metadata = "allow"
undocumented_unsafe_blocks = "forbid"
multiple_crate_versions = "allow"
