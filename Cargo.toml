[package]
name = "dip"
version = "0.1.0"
edition = "2024"

[[bin]]
path = "crates/visualizer/main.rs"
name = "dip"

[dependencies]
eframe = { version = "0.33.3", features = ["persistence"] }
egui = "0.33.0"
egui-file-dialog = "0.12.0"
egui_plot = "0.34.0"
env_logger = "0.11.8"
image = "0.25.9"
log = "0.4.29"
serde = "1.0.228"
intensity = { version = "0.1.0", path = "crates/intensity" }

[workspace]
members = [
  "crates/intensity",
]

[lints.clippy]
indexing_slicing = "warn"
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
cargo_common_metadata = "allow"
undocumented_unsafe_blocks = "forbid"
multiple_crate_versions = "allow"
