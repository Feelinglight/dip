[profile.release]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

[workspace]
resolver = "3"
members = [
  "crates/intensity",
  "crates/visualizer",
]
default-members = [
  "crates/visualizer"
]

[workspace.lints.clippy]
indexing_slicing = "warn"
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "forbid"
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
